name: Admin Runtime Tests

on:
  push:
    branches:
      - main
      - feature/admin-command-center-v2
      - feature/sales-conversation-policy
  pull_request:
    branches:
      - main

jobs:
  admin-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile production Python files
        run: python -m py_compile app.py app_entry.py production_runtime_v2.py gunicorn.conf.py
      - name: Run structured admin/CRM tests
        run: python -m pytest -q test_admin_command_center_v2.py
      - name: Run sales and language tests
        run: python -m pytest -q test_sales_conversation_policy.py test_sales_runtime.py test_human_handover_runtime.py test_sales_language_guide.py
      - name: Run unified production runtime tests
        run: python -m pytest -q test_production_runtime_v2.py
